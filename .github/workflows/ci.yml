name: check

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]  # floor and current; requires-python >= 3.11

    steps:
      - uses: actions/checkout@v4

      # The sandbox compiles and runs the harness for real; bwrap is the
      # primary network-isolation backend and tests refuse to build without it.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: mypy
        run: python -m mypy src

      - name: Fast test tier
        run: python -m pytest -m "not slow" -q

  # Real subprocesses: kill-9 resume, same-message concurrency, LLM-timeout
  # rejection (S9/S10/S14). Loopback only, like the fast tier.
  slow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Slow test tier
        run: python -m pytest -m slow -q
